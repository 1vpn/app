name: onexray
description: "Cross Platform Xray-core Client"
publish_to: "none"
version: 26.9.2+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  material_ui: ^1.2.0

  #---------- flutter.dev plugin
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  quick_actions: ^1.1.1
  go_router: ^18.0.1
  process: ^5.0.6

  #---------- dart.dev plugin
  # core
  path: ^1.9.1
  collection: ^1.19.1
  # i18n
  intl: ^0.20.3
  # native
  ffi: ^2.2.0

  #---------- google.dev plugin
  json_annotation: ^4.12.0

  #---------- flutter community
  package_info_plus: ^10.2.1

  #---------- third party plugin
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2

  dio: ^5.11.1
  uuid: ^4.6.0
  permission_handler: ^13.0.2
  file_picker: ^12.2.0
  # export
  # state management
  flutter_bloc: ^9.1.1
  shadcn_ui: ^0.56.3
  lucide_icons_flutter: ^3.1.19
  # markdown
  flutter_markdown_plus: ^1.0.12
  flutter_local_notifications: ^22.3.0
  in_app_review: ^2.0.12

  flutter_svg: ^2.0.17
  purchases_flutter: 10.13.1
  google_mobile_ads: 9.1.0

  isolate_manager: ^6.3.2

  # editor
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # desktop
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  win32: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0
  pigeon: ^28.1.0
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  ffigen: ^22.0.0
  msix: ^3.18.0

# re_editor only uses APIs that remain compatible with isolate_manager 6.x.
dependency_overrides:
  isolate_manager: ^6.3.2

msix_config:
  display_name: OneXray
  publisher_display_name: Yuan Dev LLC
  identity_name: YuanDevLLC.OneXray
  publisher: CN=3666BCB5-5482-46DD-9C19-D8A7290A39FD
  logo_path: assets/logo.png
  protocol_activation: onexray
  languages: en-us
  capabilities: internetClientServer, privateNetworkClientServer, networkingVpnProvider
  startup_task:
    task_id: VCoreStartup
    enabled: false
  os_min_version: 10.0.19042.0
  build_windows: false
  store: true

flutter_gen:
  output: lib/gen/
  assets:
    exclude:
      - assets/onevpn/**

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/dat/
    - assets/geodata/regions.json
    - assets/icon/
    - assets/app_icon/
    - assets/onevpn/brand/
    - assets/onevpn/flags/

ffigen:
  name: NativeLibrary
  description: Generated native bindings for libXray and VCore.
  llvm-path:
    - "C:\Program Files\LLVM"
  output: "lib/core/ffi/generated_bindings.dart"
  compiler-opts:
    - "-D_WIN32"
  exclude-all-by-default: true
  headers:
    entry-points:
      - "c/include/libXray.h"
      - "c/include/vcore.h"
  functions:
    include:
      - "CGoInvoke"
      - "CGoFree"
      - "VCoreWindowsVpnInvoke"
      - "VCoreFree"
